const $=id=>document.getElementById(id),cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)};const hc=$('heart').getContext('2d'),words=`Sorry|দুঃখিত|माफ़ कीजिए|Lo siento|Pardon|أسف|ごめんなさい|미안해요|Mi dispiace|Desculpa|对不起|Entschuldigung|Прости|Вибач|Özür dilerim|Συγγνώμη|מצטער|متأسفم|معاف کیجیے|Samahani|Pole|Maaf|Saya minta maaf|Xin lỗi|ขอโทษ|Pasensya na|හරිම කණගාටුයි|மன்னிக்கவும்|క్షమించండి|ക്ഷമിക്കണം|ಕ್ಷಮಿಸಿ|માફ કરશો|माफ गर्नुहोस्|ਮਾਫ਼ ਕਰਨਾ|माफ करा|Przepraszam|Promiň|Prepáč|Sajnálom|Îmi pare rău|Съжалявам|Oprosti|Žao mi je|Atvainojiet|Atsiprašau|Vabandust|Anteeksi|Förlåt|Undskyld|Unnskyld|Fyrirgefðu|Het spijt me|Em sap greu|Sílim é mo leithscéal`.replace('Sílim é mo leithscéal','Tá brón orm').split('|');let choice='',picked=0;const rows=[];hc.font='500 13px sans-serif';for(let j=0;j<44;j++){let y=1.17-j*.0505,w=0;for(let x=1.2;x>=0;x-=.009){if((x*x+y*y-1)**3-x*x*y**3<0){w=x;break}}let phrases=[],sum=0;for(let k=0;k<18;k++){let str=words[(j*17+k*7)%words.length],width=hc.measureText(str).width+9;phrases.push([str,sum,width]);sum+=width}rows.push({y,w,phrases,sum})}function heart(t){hc.clearRect(0,0,900,680);let dt=choice?(paused?4:Math.max(0,t-picked)):0,k=ease(dt/1.8),split=choice==='no'?k:0,pulse=1+.012*Math.cos(t*2.6)+(choice==='yes'?.045*k:0);hc.save();hc.translate(450,337);hc.scale(pulse,pulse);hc.font='500 13px sans-serif';for(let [j,r] of rows.entries()){if(!r.w)continue;let radius=r.w*302;for(let side of [-1,1]){hc.save();hc.translate(side*56*split,14*split);hc.rotate(side*.11*split);let cut=Math.sin(j*.74)*10;hc.beginPath();let l=side<0?-radius:Math.min(radius,cut),right=side<0?Math.max(-radius,cut):radius;hc.rect(l,-320,right-l,620);hc.clip();for(let [str,off,width] of r.phrases){let angle=((off/r.sum+t*.024+j*.127)%1)*Math.PI*2-Math.PI;if(Math.abs(angle)>1.58)continue;let x=radius*Math.sin(angle),z=Math.cos(angle),light=.26+.52*Math.abs(Math.sin(angle))**1.6+.25*Math.max(0,r.y)+.14*Math.sin(j*.21+angle*2+t*.36);if(choice==='yes')light+=.14*k;light=cl(light);hc.save();hc.translate(x,-r.y*253+6*z);hc.scale(Math.max(.15,z)*radius*6.28/r.sum,1);hc.fillStyle=`rgb(${108+146*light},${49+185*light},${79+162*light})`;hc.fillText(str,0,0);hc.restore()}hc.restore()}}hc.restore()}function choose(c){choice=c;picked=time;$('reply').textContent=c==='yes'?'thankyou baby,':'I understand, Jasmine. I’m still sorry.';$('heart').ariaLabel=c==='yes'?'A glowing heart of multilingual apologies':'A heart of apology phrases gently split in two';for(let b of ['yes','no'])$(b).setAttribute('aria-pressed',b===c);heart(time)}$('yes').onclick=()=>choose('yes');$('no').onclick=()=>choose('no');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=paused?12:0,last=0,frame=0;const garden=$('garden').getContext('2d'),wc=$('word').getContext('2d'),mask=document.createElement('canvas');mask.width=1200;mask.height=300;let mc=mask.getContext('2d');mc.font='bold 298px Georgia';mc.textAlign='center';mc.fillText('SORRY',600,249,1160);let px=mc.getImageData(0,0,1200,300).data;function floral(t){wc.clearRect(0,0,1200,300);wc.font='bold 8px monospace';for(let y=0;y<300;y+=6)for(let x=0;x<1200;x+=4){if(!px[(y*1200+x)*4+3]||t<x/1100)continue;let u=x%67-33,v=(y+Math.floor(x/67)*17)%53-26,d=Math.hypot(u,v),f=(d/10-Math.atan2(v,u)/6.28+4)%1;wc.fillStyle=d>25?'#a1b691':`rgb(${168+86*f},${73+118*f},${106+79*f})`;wc.fillText('.:+x%#@'[Math.floor(f*7)],x,y+4)}}function gardenFrame(t){garden.clearRect(0,0,600,460);garden.font='bold 9px monospace';for(let [bx,by,R,delay] of [[140,192,74,.6],[300,112,105,0],[462,175,82,1.15]]){let age=t-delay,tip=452-(452-by)*ease(age/2.7),sx=y=>bx+9*Math.sin(t*.85+bx*.03+y*.003)*(452-y)/360;for(let y=tip;y<454;y+=7){let x=sx(y);garden.fillStyle='#a8bb8f';garden.fillText('|',x,y);for(let i=0;i<2;i++){let u=(350-i*60-y)/38;if(u>0&&u<1)for(let v=-12*Math.sin(Math.PI*u);v<12*Math.sin(Math.PI*u);v+=5)garden.fillText(':',x+(i?1:-1)*57*u+v,y)}}let r=R*(.11+.89*ease((age-2)/3.2))*ease((age-1.6)/.8);if(r<1)continue;for(let y=-r;y<=r;y+=7)for(let x=-r;x<=r;x+=5){let Y=y/(r*.83),a=Math.atan2(Y,x/r),d=Math.hypot(x/r,Y);if(d>1-.11*(1+Math.cos(5*a+.4)))continue;let f=(4+d*3.35-a/6.28+.135*Math.sin(5*a+d*5))%1,l=cl(.12+.77*f**1.6-.13*Y);garden.fillStyle=`rgb(${110+145*l},${38+151*l},${66+104*l})`;garden.fillText('.:;+=x%#@'[Math.floor(l*8)],sx(tip)+x,tip+y)}}}function draw(){heart(time);if(time<5||!frame)floral(time);let k=ease((time-2.5)/2.3);document.body.style.setProperty('--show',k);document.body.style.setProperty('--ink',1-.88*k);document.body.style.setProperty('--lift',18*(1-k)+'px');document.querySelector('main').inert=k===0;let t=Math.max(0,time-2);gardenFrame(t);$('code').textContent=['const to = "Jasmine";','plant("flower");','await bloom();','print("I’m sorry.");','> I’m sorry, Jasmine.'].join('\n').slice(0,Math.floor(t*12));$('status').textContent=t<6.4?'[ growing ]':'[ in bloom ]'}function state(){document.body.classList.toggle('paused',paused);$('motion').textContent=paused?'▷  Resume':'Ⅱ  Pause';draw()}function tick(t){if(!paused){time+=Math.min((t-last)/1000,.1);if(t-frame>60){draw();frame=t}}last=t;requestAnimationFrame(tick)}$('motion').onclick=()=>{paused=!paused;state()};$('replay').onclick=()=>{choice='';$('reply').textContent='';$('heart').ariaLabel='A moving heart made of apologies in many languages';for(let b of ['yes','no'])$(b).setAttribute('aria-pressed','false');window.scrollTo(0,0);paused=false;time=0;state()};state();requestAnimationFrame(tick)</script></html>
